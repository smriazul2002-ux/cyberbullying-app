<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; font-family: -apple-system, Arial, sans-serif; padding: 14px; background: #0e1117; color: #f1f1f3; }
    h2 { font-size: 15px; margin: 0 0 8px 0; }
    p { font-size: 12px; color: #a0a3b1; line-height: 1.4; }
    .status { margin-top: 10px; padding: 8px; border-radius: 8px; background: #1a1c24; font-size: 12px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; margin-right: 6px; }
  </style>
</head>
<body>
  <h2>🛡️ Cyberbullying Detector</h2>
  <p>Highlights potentially harmful comments directly on Facebook, YouTube, and Twitter/X pages using your local detection API.</p>
  <div class="status"><span class="dot"></span>Active on supported sites</div>
  <p style="margin-top:10px;">Make sure <code>api.py</code> is running locally (<code>uvicorn api:app</code>) for detection to work.</p>
</body>
</html>
