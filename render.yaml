services:
  - type: web
    name: cyberbullying-shield-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: MODEL_VERSION
        value: hybrid-word-char-rules-v3.0
      - key: MODEL_THRESHOLD
        value: "0.40"
      - key: YOUTUBE_API_KEY
        sync: false
